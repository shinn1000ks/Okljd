name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -name "*.zip" -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android project ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "ZIP extracted successfully."

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find project -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside the ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Gradle project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Detect Android SDK requirements
        shell: bash
        run: |
          set -e

          echo "Checking Android project configuration..."

          find "$PROJECT_DIR" -maxdepth 3 \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -type f \
            -print

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xianxia-cultivator-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
